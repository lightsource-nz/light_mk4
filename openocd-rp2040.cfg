adapter speed 5000

#   CORE 0 ONLY by default, which is not rp2040.cfg's default (USE_CORE SMP -- both cores in an
# hwthread RTOS group). See openocd-rp2350.cfg for the full reasoning and measurements; it
# applies identically, since both chips run the same shell and the same core 1 log drain.
#
#   TO INSPECT CORE 1 (rp2040.cfg names them core0/core1, not cm0/cm1):
#
#     openocd -c "set USE_CORE SMP" -f openocd-rp2040.cfg
#
#   expect the firmware to stall when you do; that is the reason for the default.
if { ![info exists USE_CORE] } {
        set USE_CORE 0
}
source [find target/rp2040.cfg]
