[package]
name = "light-stm32h7"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "STM32H743 board access for the light framework, on bare CMSIS: the mini_stm32h7 port"

[dependencies]
light-core = { path = "../light-core" }
#   single core: the critical section is PRIMASK alone, which cortex-m's own implementation
# provides -- the dual-core spinlock the RP2350 port needs has no counterpart here
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
critical-section = "1.2"
