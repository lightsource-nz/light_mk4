[package]
name = "light_app_ui_demo_touch349"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the widget demo (light_app_ui_demo) on the Waveshare RP2350-Touch-LCD-3.49: the per-board app -- board wiring around the portable demo, plus this board's UI design override"

[lib]
crate-type = ["staticlib"]

[dependencies]
light_app_ui_demo = { path = "../light_app_ui_demo" }
light-core = { path = "../light-core" }
light-draw = { path = "../light-draw" }
light-display = { path = "../light-display" }
light-input = { path = "../light-input" }
light-ui = { path = "../light-ui" }
light-audio = { path = "../light-audio" }
light-rp2 = { path = "../light-rp2", features = ["rp2350"] }
light-board-touch349 = { path = "../light-board-touch349" }
light-rtc = { path = "../light-rtc" }
light-sd = { path = "../light-sd" }
light-fs = { path = "../light-fs" }
light-font = { path = "../light-font" }
