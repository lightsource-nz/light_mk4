[package]
name = "light-rp2350"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "RP2350 board access for the light framework via rp235x-pac (mk4 spike)"

[features]
#   the TinyUSB host transport, which resolves against tinyusb_host at link time: only a
# firmware whose shell was built in the host role can carry it
usb-host = []

[dependencies]
light-core = { path = "../light-core" }
#   no `rt` feature: the vector table, reset handler and linker script belong to pico-sdk's
# runtime in the C shell. This crate only wants the register definitions
rp235x-pac = { version = "0.2", default-features = false }
#   PRIMASK for the critical section; no `critical-section-single-core` feature, because that
# implementation is wrong on a dual-core part -- see src/critical.rs
cortex-m = "0.7"
#   the restore state is "was this the outermost section", one bool
critical-section = { version = "1.2", features = ["restore-state-bool"] }
