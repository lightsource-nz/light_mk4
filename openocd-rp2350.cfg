adapter speed 5000

#   CORE 0 ONLY by default, which is not the rp2350.cfg default (both cores, SMP hwthread).
#
#   WHY: merely EXAMINING core 1 disturbs it. The framework runs its message-queue drain worker
# on core 1, and that worker holds the stream's critical section while it writes. Examined at
# the wrong moment it stops there still holding the lock, and core 0 then blocks forever on its
# next log call -- a board that dies partway through module loading for no visible reason.
# Measured on an RP2350 running the same framework and the same core 1 worker: with core 1
# attached, 6 of 6 resets stalled at ~950 characters of console output; with core 0 alone, 4 of
# 4 reached the application main loop at 2901 characters, byte-identical each time.
#
#   this is NOT the SMP grouping -- USE_SMP 0 with both cores still stalled, 4 of 4.
#
#   -defer-examine was tried first and is the more elegant answer, since it declares core 1
# without touching it. It had to be abandoned: `program` performs its own reset, that reset
# walks every declared target, and a deferred core has no Debug AP to reset through -- so
# flashing failed outright with "Unable to reset target". A config that cannot flash is worse
# than one that cannot see core 1.
#
#   this board's firmware genuinely uses both cores -- TinyUSB and the log drain both run on
# core 1 (see LIGHT_PLATFORM_USB_ON_CORE1) -- which was the original argument for the two-core
# default, and it still holds. It is why the override below exists rather than core 1 being
# written out entirely. But a debug setup that stops the firmware from running hides far more
# than a single-core view does.
#
#   TO INSPECT CORE 1, override from the command line -- the guard below leaves USE_CORE alone
# if it is already set:
#
#     openocd -c "set USE_CORE {cm0 cm1}" -f openocd-rp2350.cfg
#
#   expect the firmware to stall when you do. That is still the right tool for a post-mortem,
# where the board has already stopped and you want to know what core 1 was doing.
if { ![info exists USE_CORE] } {
        set USE_CORE 0
}
