[package]
name = "light_app_crossfire"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "crossfire: USB-MIDI forwarding between every instrument on the host port, with the po13 OLED as the status display"

[lib]
crate-type = ["staticlib"]

[dependencies]
light-core = { path = "../../../crates/light-core" }
light-draw = { path = "../../../crates/light-draw" }
light-display = { path = "../../../crates/light-display" }
light-midi = { path = "../../../crates/light-midi" }
light-rp2350 = { path = "../../../crates/light-rp2350", features = ["usb-host"] }
light-font = { path = "../../../crates/light-font" }
