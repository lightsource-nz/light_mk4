[package]
name = "light_app_crossfire"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "crossfire: USB-MIDI forwarding between every instrument on the host port, with the po13 OLED as the status display"

[lib]
crate-type = ["staticlib"]

[dependencies]
light-core = { path = "../../../crates/light-core" }
light-draw = { path = "../../../crates/light-draw" }
light-display = { path = "../../../crates/light-display" }
light-midi = { path = "../../../crates/light-midi" }
light-rp2 = { path = "../../../crates/light-rp2", features = ["usb-host"] }

light-font = { path = "../../../crates/light-font" }

#   which Pico: the tree's PICO_PLATFORM chooses, through corrosion_set_features in the root
# CMakeLists. The two Picos are pin-compatible, so the wiring is the same either way
[features]
rp2040 = ["light-rp2/rp2040"]
rp2350 = ["light-rp2/rp2350"]
