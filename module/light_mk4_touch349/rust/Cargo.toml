[package]
name = "light_app_touch349"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the Rust half of the Waveshare RP2350-Touch-LCD-3.49 firmware: the widget demo on the QSPI bar display"

[lib]
crate-type = ["staticlib"]

[dependencies]
light_app_ui_demo = { path = "../../../crates/light_app_ui_demo" }
light-core = { path = "../../../crates/light-core" }
light-draw = { path = "../../../crates/light-draw" }
light-display = { path = "../../../crates/light-display" }
light-input = { path = "../../../crates/light-input" }
light-ui = { path = "../../../crates/light-ui" }
light-audio = { path = "../../../crates/light-audio" }
light-rp2 = { path = "../../../crates/light-rp2", features = ["rp2350"] }
light-rtc = { path = "../../../crates/light-rtc" }
light-sd = { path = "../../../crates/light-sd" }
light-fs = { path = "../../../crates/light-fs" }
light-font = { path = "../../../crates/light-font" }
