[package]
name = "light_app_touch28"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the Rust half of the Waveshare RP2350-Touch-LCD-2.8 firmware: the widget demo, and the CST328's first bring-up"

[lib]
crate-type = ["staticlib"]

[dependencies]
light-core = { path = "../../../crates/light-core" }
light-draw = { path = "../../../crates/light-draw" }
light-display = { path = "../../../crates/light-display" }
light-input = { path = "../../../crates/light-input" }
light-ui = { path = "../../../crates/light-ui" }
light-rp2 = { path = "../../../crates/light-rp2", features = ["rp2350"] }
light-font = { path = "../../../crates/light-font" }
