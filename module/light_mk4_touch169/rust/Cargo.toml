[package]
name = "light_app_touch169"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the Rust half of the touch169 spike firmware, linked into a pico-sdk executable"

[lib]
#   a staticlib is what Corrosion hands to CMake for the C shell to link. No rlib: nothing
# else in the workspace depends on this crate
crate-type = ["staticlib"]

[dependencies]
light_app_ui_demo = { path = "../../../crates/light_app_ui_demo" }
light-core = { path = "../../../crates/light-core" }
light-draw = { path = "../../../crates/light-draw" }
light-display = { path = "../../../crates/light-display" }
light-input = { path = "../../../crates/light-input" }
light-ui = { path = "../../../crates/light-ui" }
light-audio = { path = "../../../crates/light-audio" }
light-rp2 = { path = "../../../crates/light-rp2", features = ["rp2350"] }
light-font = { path = "../../../crates/light-font" }
critical-section = "1.2"
