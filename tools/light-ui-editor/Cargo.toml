[package]
name = "light-ui-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "a prototype desktop editor for light-ui embedded UIs, built on the light-host-gui runtime"

[[bin]]
name = "light-ui-editor"
path = "src/main.rs"

[dependencies]
#   light-host-gui hosts the window and re-exports egui/eframe: the editor chrome (inspector text
# fields, combo boxes, checkboxes, number spinners) is egui, while the device PREVIEW is rendered by
# light-ui/light-draw into a pixel buffer (the DisplayDriver seam, via light-host-gui's NullDriver)
# and shown as an egui image -- pixel-faithful to firmware, with proper controls around it.
light-host-gui = { path = "../light-host-gui" }
light-draw = { path = "../../crates/light-draw" }
light-ui = { path = "../../crates/light-ui" }
light-display = { path = "../../crates/light-display" }
light-core = { path = "../../crates/light-core" }
light-font = { path = "../../crates/light-font", features = ["alloc"] }
#   the shared asset core: the design model, the font rasteriser and the theme compiler, the same
# code crush runs, so the editor mirrors none of it
crush-core = { path = "../crush-core" }
#   light-core (under light-ui) uses critical-section; the final binary picks the impl -- the std
# one on the host
critical-section = { version = "1.2", features = ["std"] }
