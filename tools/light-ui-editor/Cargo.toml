[package]
name = "light-ui-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "a prototype desktop editor for light-ui embedded UIs, built on the light-host-gui shell"

[[bin]]
name = "light-ui-editor"
path = "src/main.rs"

[dependencies]
light-host-gui = { path = "../light-host-gui" }
light-draw = { path = "../../crates/light-draw" }
light-ui = { path = "../../crates/light-ui" }
light-display = { path = "../../crates/light-display" }
light-core = { path = "../../crates/light-core" }
light-font = { path = "../../crates/light-font", features = ["alloc"] }
#   light-core (under light-ui) uses critical-section; the final binary picks the impl -- the std
# one on the host
critical-section = { version = "1.2", features = ["std"] }
#   bundled: FreeType is compiled in, so the editor rasterises its preview font with no system
# library to find -- the same arrangement crush uses
freetype-rs = { version = "0.38", features = ["bundled"] }
