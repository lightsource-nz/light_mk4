[package]
name = "crush"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "font-crusher in Rust: renders TrueType fonts into LGF bitmap fonts for light firmware"

[[bin]]
name = "crush"
path = "src/main.rs"

[dependencies]
light-font = { path = "../../crates/light-font", features = ["alloc"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
#   bundled: FreeType is compiled into the binary, so a checkout builds with no system
# library to find -- the same reason mk3's font-crusher vendored it as a submodule
freetype-rs = { version = "0.38", features = ["bundled"] }

[dev-dependencies]
light-font = { path = "../../crates/light-font", features = ["alloc"] }
